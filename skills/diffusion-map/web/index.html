<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Diffusion Maps</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C23B22'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23C23B22' stroke-opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%23C23B22' stroke-opacity='.15'/%3E%3C/svg%3E"
    />
    <!-- No build step: libraries load as native ES modules from a CDN, pinned to exact versions. -->
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.27.2",
          "preact/hooks": "https://esm.sh/preact@10.27.2/hooks",
          "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
          "marked": "https://esm.sh/marked@16.4.2",
          "dompurify": "https://esm.sh/dompurify@3.3.0"
        }
      }
    </script>
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Serif+SC:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("dm-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
      // If the CDN modules cannot load, say so instead of leaving a blank page.
      setTimeout(() => {
        if (window.__dmReady) return;
        const el = document.getElementById("boot");
        if (el)
          el.textContent =
            localStorage.getItem("dm-lang") === "zh"
              ? "界面依赖需要从 esm.sh 加载，但现在连不上。请检查网络后刷新页面。"
              : "The interface loads its libraries from esm.sh, which is unreachable right now. Check the network and reload.";
      }, 8000);
    </script>
  </head>
  <body>
    <div id="app"><p id="boot" class="loading"></p></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
